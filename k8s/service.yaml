apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: 3rax
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    protocol: TCP
  sessionAffinity: None

---
apiVersion: v1
kind: Service
metadata:
  name: backend-nodeport
  namespace: 3rax
  labels:
    app: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    nodePort: 30001
    protocol: TCP
