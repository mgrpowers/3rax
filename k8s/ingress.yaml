apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: 3rax
  annotations:
    # For Traefik (default in K3s)
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # Uncomment for HTTPS
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
  - host: 3rax.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 3001
  # Uncomment for HTTPS
  # tls:
  # - hosts:
  #   - 3rax.local
  #   secretName: 3rax-tls
