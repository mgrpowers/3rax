apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: 3rax
type: Opaque
stringData:
  # Update this with your actual database URL
  # For in-cluster PostgreSQL:
  DATABASE_URL: "postgresql://inventory:inventory@postgres-service:5432/inventory?schema=public"
  # For external PostgreSQL:
  # DATABASE_URL: "postgresql://inventory:inventory@192.168.50.xxx:5432/inventory?schema=public"
  
  # Optional: Database credentials (if using separate vars)
  DB_USER: "inventory"
  DB_PASSWORD: "inventory"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "inventory"
