apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: 3rax

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
  # - ingress.yaml  # Uncomment if using ingress

# Optional: Add common labels
commonLabels:
  app.kubernetes.io/name: 3rax
  app.kubernetes.io/part-of: inventory-system

# Optional: Add annotations
commonAnnotations:
  managed-by: kustomize
