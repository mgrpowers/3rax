version: '3.8'

services:
  nats:
    image: nats:latest
    container_name: 3rax-nats
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # HTTP monitoring
      - "6222:6222"  # Cluster connections
    command: 
      - "--http_port"
      - "8222"
    restart: unless-stopped
    networks:
      - 3rax-network

networks:
  3rax-network:
    driver: bridge

# Usage:
# Start NATS:  docker-compose -f docker-compose.nats.yml up -d
# Stop NATS:   docker-compose -f docker-compose.nats.yml down
# View logs:   docker-compose -f docker-compose.nats.yml logs -f
# Monitoring:  http://localhost:8222
